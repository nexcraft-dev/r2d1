name: Maven Central Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Check out the merged release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve release version and validate the merged commit
        id: validate
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$RELEASE_BRANCH" != release/* ]]; then
            echo "Only release/<major>.<minor>.<patch> branches can publish"
            exit 1
          fi
          release_version="${RELEASE_BRANCH#release/}"
          if [[ ! "$release_version" =~ $semver_regex ]]; then
            echo "Release branches must match release/<major>.<minor>.<patch>"
            exit 1
          fi
          release_tag="v$release_version"
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "The merged release commit SHA is missing or invalid"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "The merged release commit is not reachable from main"
            exit 1
          fi

          echo "VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $release_tag from merged release commit $RELEASE_SHA"

      - name: Run verification build
        run: ./gradlew -Pr2d1.version="$VERSION" clean check

      - name: Validate publishing configuration
        run: ./gradlew -Pr2d1.version="$VERSION" validateMavenCentralConfiguration

      - name: Publish all six artifacts locally and verify signatures
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -Pr2d1.version="$VERSION" publishToMavenLocal
          for module in r2d1 r2d1-filesystem r2d1-jdbc r2d1-micronaut r2d1-spring-boot-autoconfigure r2d1-spring-boot-starter; do
            repository="$HOME/.m2/repository/dev/nexcraft/$module/$VERSION"
            test -f "$repository/$module-$VERSION.jar"
            test -f "$repository/$module-$VERSION-module.json"
            test -f "$repository/$module-$VERSION-sources.jar"
            test -f "$repository/$module-$VERSION-javadoc.jar"
            test -f "$repository/$module-$VERSION.pom"
            test -f "$repository/$module-$VERSION.jar.asc"
            test -f "$repository/$module-$VERSION-module.json.asc"
            test -f "$repository/$module-$VERSION-sources.jar.asc"
            test -f "$repository/$module-$VERSION-javadoc.jar.asc"
            test -f "$repository/$module-$VERSION.pom.asc"
          done

      - name: Create or verify the release tag
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            existing_tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          elif git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"; then
            existing_tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          else
            existing_tag_sha=""
          fi

          if [[ -n "$existing_tag_sha" ]]; then
            if [[ "$existing_tag_sha" != "$RELEASE_SHA" ]]; then
              echo "Refusing to replace $RELEASE_TAG: it points to $existing_tag_sha, not $RELEASE_SHA"
              exit 1
            fi
            echo "$RELEASE_TAG already points to the merged release commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish the validated batch to Maven Central
        run: ./gradlew -Pr2d1.version="$VERSION" publishToMavenCentral

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release for the published tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "R2D1 $RELEASE_TAG"
          fi
