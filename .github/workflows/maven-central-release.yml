name: Maven Central Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: maven-central-release
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ $semver_regex ]]; then
              echo "Release tags must match v<major>.<minor>.<patch>"
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
            create_tag=false
          else
            release_tag=""
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ $semver_regex ]]; then
                release_tag="$candidate"
                break
              fi
            done < <(git tag --points-at "$GITHUB_SHA" --sort=-version:refname)

            if [[ -n "$release_tag" ]]; then
              create_tag=false
            else
              latest_tag=""
              while IFS= read -r candidate; do
                if [[ "$candidate" =~ $semver_regex ]]; then
                  latest_tag="$candidate"
                  break
                fi
              done < <(git tag --list 'v*' --sort=-version:refname)

              if [[ -z "$latest_tag" ]]; then
                release_tag="v1.0.0"
              else
                IFS=. read -r major minor patch <<< "${latest_tag#v}"
                release_tag="v${major}.$((10#$minor + 1)).0"
              fi
              create_tag=true
            fi
          fi

          echo "VERSION=${release_tag#v}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "CREATE_TAG=$create_tag" >> "$GITHUB_ENV"
          echo "Resolved release $release_tag (create tag: $create_tag)"

      - name: Run verification build
        run: ./gradlew -Pr2d1.version="$VERSION" clean check

      - name: Validate publishing configuration
        run: ./gradlew -Pr2d1.version="$VERSION" validateMavenCentralConfiguration

      - name: Publish locally and validate release artifacts
        run: |
          ./gradlew -Pr2d1.version="$VERSION" publishToMavenLocal
          for module in r2d1-core r2d1-d1 r2d1-r2 r2d1-jdbc; do
            repository="$HOME/.m2/repository/dev/nexcraft/$module/$VERSION"
            test -f "$repository/$module-$VERSION.jar"
            test -f "$repository/$module-$VERSION-sources.jar"
            test -f "$repository/$module-$VERSION-javadoc.jar"
            test -f "$repository/$module-$VERSION.pom"
            test -f "$repository/$module-$VERSION.jar.asc"
            test -f "$repository/$module-$VERSION-sources.jar.asc"
            test -f "$repository/$module-$VERSION-javadoc.jar.asc"
            test -f "$repository/$module-$VERSION.pom.asc"
          done

      - name: Create release tag
        if: env.CREATE_TAG == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish and automatically release on Maven Central
        run: ./gradlew -Pr2d1.version="$VERSION" publishToMavenCentral
