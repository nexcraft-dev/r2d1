name: Micronaut Native Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/micronaut-native.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "r2d1-core/**"
      - "r2d1-jdbc/**"
      - "r2d1-micronaut/**"
  pull_request:
    paths:
      - ".github/workflows/micronaut-native.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "r2d1-core/**"
      - "r2d1-jdbc/**"
      - "r2d1-micronaut/**"

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Micronaut H2 native test
        run: ./gradlew -Pr2d1.javaToolchainVersion=25 :r2d1-micronaut:nativeTest
