name: Quarkus Native Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quarkus-native.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "r2d1/**"
      - "r2d1-filesystem/**"
      - "r2d1-jdbc/**"
      - "r2d1-quarkus*/**"
  pull_request:
    paths:
      - ".github/workflows/quarkus-native.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "r2d1/**"
      - "r2d1-filesystem/**"
      - "r2d1-jdbc/**"
      - "r2d1-quarkus*/**"

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Quarkus filesystem and H2 native smoke
        run: ./gradlew -Pr2d1.javaToolchainVersion=25 :r2d1-quarkus-integration-tests:testNative -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false
