quarkus.r2d1.enabled=true
quarkus.r2d1.document.type=filesystem
quarkus.r2d1.index.type=jdbc
quarkus.r2d1.filesystem.root-directory=${java.io.tmpdir}/r2d1-quarkus-smoke-${quarkus.uuid}
quarkus.r2d1.filesystem.executor=documents
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:r2d1;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false
# Exercise exact Quarkus datasource qualifiers while a default datasource also exists.
quarkus.datasource."selected".db-kind=h2
quarkus.datasource."selected".jdbc.url=jdbc:h2:mem:r2d1-selected;DB_CLOSE_DELAY=-1
quarkus.datasource."selected".devservices.enabled=false
quarkus.r2d1.jdbc.datasource=selected
